<!DOCTYPE html>
<!-- ============================================================
     SHORKNET BLOG POST TEMPLATE
     how to use:
       1. copy this file and rename it, e.g. my-cool-post.html
       2. replace everything marked EDIT below
       3. add the post to the TOP of the <ul class="post-list">
          in blog/index.html (there's a comment showing where)
     ============================================================ -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- EDIT: page title, format "shorknet — your post title" -->
    <title>shorknet — post title</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦈</text></svg>">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .page {
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 24px 64px;
        }

        .tag {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #4a7a6e;
            margin-bottom: 8px;
        }

        .headline {
            font-size: 2.4em;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin: 0 0 4px;
            color: #e0eee8;
        }

        .headline em {
            font-style: normal;
            color: #2dd4bf;
        }

        .sub {
            color: #5a8a7e;
            font-size: 14px;
            margin: 0 0 32px;
        }

        .nav-bar {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin: 0 0 40px;
        }

        .nav-bar a {
            display: inline-block;
            padding: 6px 14px;
            font-size: 13px;
            color: #5a8a7e;
            border: 1px solid transparent;
            transition: color 0.15s, border-color 0.15s;
        }
        .nav-bar a:hover {
            color: #e0f0e8;
            border-color: #1e2e2a;
            text-decoration: none;
        }
        .nav-bar a.current {
            color: #d0e8de;
            border-color: #1e2e2a;
            background: #16221e;
        }

        .post-body p {
            margin: 0 0 18px;
        }

        .post-body h2 {
            margin: 32px 0 12px;
            color: #e0eee8;
        }

        .back {
            display: inline-block;
            margin-top: 32px;
            font-size: 14px;
        }

        .foot {
            margin-top: 48px;
            padding-top: 20px;
            border-top: 1px solid #162622;
            font-size: 12px;
            color: #3a5a52;
            text-align: center;
        }
        .foot a {
            color: #4a7a6e;
        }
        .foot a:hover {
            color: #5eead4;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="nav-bar">
            <a href="../index.html">home</a>
            <a href="../aboutme.html">about</a>
            <a href="index.html" class="current">blog</a>
            <a href="../guestbook.html">guestbook</a>
            <a href="../resources.html">resources</a>
            <a href="https://git.shorknet.net" target="_blank">git</a>
            <a href="https://github.com/ShorkiStudios" target="_blank">github</a>
        </div>

        <div class="tag">shorknet / blog</div>
        <!-- EDIT: post title (keep the <em>.</em> at the end, it's the teal dot) -->
        <h1 class="headline">post title<em>.</em></h1>
        <!-- EDIT: date, DD/MM/YYYY like the rest of the site -->
        <p class="sub">01/01/2026</p>

        <div class="post-body">
            <!-- EDIT: your post. <p> for paragraphs, <h2> for sub-headings. -->
            <p>first paragraph.</p>
            <p>second paragraph.</p>
        </div>

        <a class="back" href="index.html">← back to blog</a>

        <div class="foot">
            shorki
        </div>
    </div>
</body>
</html>
