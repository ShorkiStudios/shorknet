<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shorknet — blog</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦈</text></svg>">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .page {
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 24px 64px;
        }

        .tag {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #4a7a6e;
            margin-bottom: 8px;
        }

        .headline {
            font-size: 2.4em;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin: 0 0 4px;
            color: #e0eee8;
        }

        .headline em {
            font-style: normal;
            color: #2dd4bf;
        }

        .sub {
            color: #5a8a7e;
            font-size: 14px;
            margin: 0 0 32px;
        }

        .nav-bar {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin: 0 0 40px;
        }

        .nav-bar a {
            display: inline-block;
            padding: 6px 14px;
            font-size: 13px;
            color: #5a8a7e;
            border: 1px solid transparent;
            transition: color 0.15s, border-color 0.15s;
        }
        .nav-bar a:hover {
            color: #e0f0e8;
            border-color: #1e2e2a;
            text-decoration: none;
        }
        .nav-bar a.current {
            color: #d0e8de;
            border-color: #1e2e2a;
            background: #16221e;
        }

        .post-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .post-list li {
            margin-bottom: 26px;
            padding-bottom: 26px;
            border-bottom: 1px solid #1a2a26;
        }

        .post-list li:last-child {
            border-bottom: none;
        }

        .post-date {
            color: #4a7a6e;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .post-list h2 {
            margin: 6px 0 8px;
        }

        .post-list p {
            color: #7aa89c;
            font-size: 14px;
            margin: 0;
        }

        .foot {
            margin-top: 48px;
            padding-top: 20px;
            border-top: 1px solid #162622;
            font-size: 12px;
            color: #3a5a52;
            text-align: center;
        }
        .foot a {
            color: #4a7a6e;
        }
        .foot a:hover {
            color: #5eead4;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="nav-bar">
            <a href="../index.html">home</a>
            <a href="../aboutme.html">about</a>
            <a href="index.html" class="current">blog</a>
            <a href="../guestbook.html">guestbook</a>
            <a href="../resources.html">resources</a>
            <a href="https://git.shorknet.net" target="_blank">git</a>
            <a href="https://github.com/ShorkiStudios" target="_blank">github</a>
        </div>

        <div class="tag">shorknet</div>
        <h1 class="headline">blog<em>.</em></h1>
        <p class="sub">longer thoughts, project notes, whatever. newest first.</p>

        <ul class="post-list">
            <!-- newest post goes at the TOP of this list.
                 copy the <li> block, change the date, title, link, and blurb. -->
            <li>
                <div class="post-date">30/09/2026</div>
                <h2><a href="hello-blog.html">hello, blog</a></h2>
                <p>the blog is live. here's what this is for.</p>
            </li>
        </ul>

        <div class="foot">
            shorki
        </div>
    </div>
</body>
</html>
